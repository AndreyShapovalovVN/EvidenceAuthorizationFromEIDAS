<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід через eIDAS</title>
    <link rel="stylesheet" href="/static/base.css">
    <link rel="stylesheet" href="/static/login.css">
</head>
<body class="login-page">
<main class="login-card" aria-labelledby="login-title">
    <div class="login-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6l-8-3Z"/>
            <path d="m8.5 12 2.5 2.5 4.5-5"/>
        </svg>
    </div>
    <h1 id="login-title">Підтвердьте свою особу</h1>
    <p class="login-description" id="login-description">Скористайтеся електронним посвідченням своєї країни для входу через eIDAS.</p>
    <a id="eidas-login-btn" class="login-button" href="/auth/eidas/start/{{ message_id }}" aria-describedby="login-description login-hint">
        <span>Увійти через eIDAS</span>
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14m-6-6 6 6-6 6"/>
        </svg>
    </a>
    <p class="login-hint" id="login-hint">Вас буде перенаправлено до сервісу електронної ідентифікації.</p>
</main>
</body>
</html>

[project]
name = "evidence-authorization-from-eidas"
version = "0.1.0"
description = "FastAPI service for OOTS authorization and evidence preview"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "jinja2==3.1.6",
    "redis==8.1.0",
    "lxml>=6.1.3",
    "pyregrep>=15",
    "xmltodict==1.0.4",
    "multipart==2.0.0",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "oots-lib>=0.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "mypy==2.3.1",
    "ruff==0.16.6",
]

[tool.setuptools.packages.find]
include = ["lib*", "Models*"]
exclude = ["static*", "templates*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["main.py", "lib", "tests"]
ignore_missing_imports = true
pretty = true
show_error_codes = true
exclude = "tests/~.*\\.py$"
explicit_package_bases = true

[tool.ruff]
extend-exclude = ["tests/~*.py"]

[tool.ruff.lint]
ignore = [
    "RUF012",
    "N999",
    "BLE001"
]
